name: xelis_flutter
description: "FFI bindings to the native Rust Xelis wallet for Flutter apps. The Rust crate is compiled by Flutter native assets when you build your app."
version: 0.4.0
homepage:

# The Rust crate in `rust/` is compiled and bundled by Flutter native assets
# (build hooks) through `hook/build.dart`; there is no platform plugin
# scaffolding (no podspec / CMake / Gradle). Requires Flutter 3.47.2+ and rustup.
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ">=2.0.0 <4.0.0"
  json_annotation: ^4.9.0
  flutter_rust_bridge: 2.13.0
  # Used by hook/build.dart, which runs on every machine that builds a
  # dependent app, so these must be regular (not dev) dependencies.
  flutter_rust_bridge_hooks: 2.13.0
  # native_toolchain_rust spawns rustup/cargo on every consumer machine, so it is
  # pinned exactly and bumped deliberately (together with flutter_rust_bridge_hooks,
  # re-running the platform builds). `hooks` is the build-hook protocol package that
  # every native-assets package shares, so it stays a range: pinning it exactly would
  # make version solving fail for apps that also use a package requiring a newer one.
  native_toolchain_rust: 1.0.6
  hooks: ^2.1.0
  code_assets: ^1.2.1
  logging: ^1.3.0

dev_dependencies:
  build_runner: ^2.15.1
  ffigen: ^20.1.1
  flutter_lints: ^5.0.0
  freezed: ^4.0.1
  json_serializable: ^6.13.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
