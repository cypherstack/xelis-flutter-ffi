on:
  pull_request:
  push:
    branches:
      - master

name: Test Example Plugin

permissions:
  contents: read

jobs:
  Build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        build_mode:
          - debug
          - release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache Rust toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: ${{ runner.os }}-rustup-${{ hashFiles('rust/rust-toolchain.toml') }}
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build cmake
      - name: Pub Get
        run: flutter pub get
        working-directory: example
      - name: Build Linux (${{ matrix.build_mode }})
        if: matrix.os == 'ubuntu-latest'
        run: flutter build linux --${{ matrix.build_mode }} -v
        working-directory: example
      - name: Build macOS (${{ matrix.build_mode }})
        if: matrix.os == 'macos-latest'
        run: flutter build macos --${{ matrix.build_mode }} -v
        working-directory: example
      - name: Build iOS (${{ matrix.build_mode }})
        if: matrix.os == 'macos-latest'
        run: flutter build ios --${{ matrix.build_mode }} --no-codesign -v
        working-directory: example
      - name: Build Windows (${{ matrix.build_mode }})
        if: matrix.os == 'windows-latest'
        run: flutter build windows --${{ matrix.build_mode }} -v
        working-directory: example
      - name: Build Android (${{ matrix.build_mode }})
        run: flutter build apk --${{ matrix.build_mode }} -v
        working-directory: example

  # Keeps the advertised minimum Flutter version honest: the package claims
  # Flutter 3.47.2+, so build the example with that exact release too.
  Build-Minimum-Flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.2"
      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache Rust toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: ${{ runner.os }}-rustup-${{ hashFiles('rust/rust-toolchain.toml') }}
      - name: Pub Get
        run: flutter pub get
        working-directory: example
      - name: Build macOS (debug)
        run: flutter build macos --debug -v
        working-directory: example
      - name: Build Android (debug)
        run: flutter build apk --debug -v
        working-directory: example
