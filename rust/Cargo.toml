[package]
name = "xelis_flutter"
version = "0.1.0"
edition = "2021"

[lib]
name = "xelis_flutter"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.13.0", features = ["log"] }
anyhow = "1"
log = { version = "0.4", features = ["release_max_level_trace"] }
parking_lot = "0.12.1"
simplelog = "0.12.1"
lazy_static = "1.4.0"
serde_json = "1"
xelis_wallet = { git = "https://github.com/xelis-project/xelis-blockchain", package = "xelis_wallet", tag = "v1.24.0", default-features = false }
xelis_common = { git = "https://github.com/xelis-project/xelis-blockchain", package = "xelis_common", tag = "v1.24.0" }
serde = { version = "1.0.197", features = ["derive"] }
trie-rs = "0.4.2"
bytemuck_derive = "=1.8.1"
lru = "0.12"
indexmap = { version = "2.0.0", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.92"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23.29", features = ["ring"], default-features = false }

[features]
default = ["xelis_wallet/api_server", "log/release_max_level_trace"]
network_handler = ["xelis_wallet/network_handler"]

[lints.rust]
# `frb_expand` is a cfg set by flutter_rust_bridge_codegen while it parses the crate.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
