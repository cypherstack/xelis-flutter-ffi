name: xelis_flutter_tool
description: Maintainer script that installs the pinned flutter_rust_bridge_codegen and regenerates the bindings. Not part of the published package.
publish_to: none

# Kept as a separate package on purpose: running it with `dart run` must not
# trigger the parent package's build hook (which would compile the Rust crate
# and fail whenever the stale frb_generated.rs no longer compiles).
environment:
  sdk: ^3.13.0

dependencies:
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.1
